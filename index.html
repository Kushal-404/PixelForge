<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelForge — Pixel Art Maker</title>

  <!-- Display / body / mono type pairing. Loaded from Google Fonts;
       everything falls back to system fonts if the request fails. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============================= HEADER ============================= -->
  <header class="app-header">
    <div class="brand">
      <!-- Self-referential "signature" mark: a 5x5 pixel grid built the
           same way the drawing canvas is, spelling out a tiny brush glyph.
           Colors come straight from the CSS accent variables. -->
      <div class="brand-mark" aria-hidden="true">
        <span class="p p--amber"></span><span class="p"></span><span class="p"></span><span class="p p--violet"></span><span class="p"></span>
        <span class="p"></span><span class="p p--amber"></span><span class="p"></span><span class="p p--violet"></span><span class="p"></span>
        <span class="p"></span><span class="p"></span><span class="p p--cyan"></span><span class="p"></span><span class="p"></span>
        <span class="p"></span><span class="p p--violet"></span><span class="p"></span><span class="p p--amber"></span><span class="p"></span>
        <span class="p"></span><span class="p"></span><span class="p"></span><span class="p"></span><span class="p"></span>
      </div>
      <div class="brand-text">
        <h1>PixelForge</h1>
        <p class="brand-tagline">Vanilla HTML / CSS / JS pixel editor</p>
      </div>
    </div>
  </header>

  <!-- ============================== LAYOUT ============================= -->
  <div class="app-layout">

    <!-- ----------------------------- SIDEBAR ---------------------------- -->
    <aside class="sidebar">

      <!-- Canvas size ----------------------------------------------------->
      <section class="panel" aria-labelledby="size-heading">
        <h2 id="size-heading" class="panel-title">Canvas</h2>

        <div class="field-row">
          <label class="field">
            <span class="field-label">Width</span>
            <input type="number" id="width-input" min="1" max="64" value="16" inputmode="numeric" />
          </label>
          <label class="field">
            <span class="field-label">Height</span>
            <input type="number" id="height-input" min="1" max="64" value="16" inputmode="numeric" />
          </label>
        </div>

        <button id="generate-btn" class="btn btn-secondary btn-block" type="button">
          Generate grid
        </button>

        <div class="preset-row" role="group" aria-label="Grid size presets">
          <button class="chip" type="button" data-preset="8">8×8</button>
          <button class="chip" type="button" data-preset="16">16×16</button>
          <button class="chip" type="button" data-preset="32">32×32</button>
        </div>
      </section>

      <!-- Tools ------------------------------------------------------------>
      <section class="panel" aria-labelledby="tools-heading">
        <h2 id="tools-heading" class="panel-title">Tools</h2>

        <div class="tool-grid" role="group" aria-label="Drawing tools">
          <button class="tool-btn is-active" type="button" data-tool="pen" aria-pressed="true" title="Pen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
            <span>Pen</span>
          </button>

          <button class="tool-btn" type="button" data-tool="eraser" aria-pressed="false" title="Eraser">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 20H8l-6-6a2 2 0 0 1 0-2.8L13.2 2 22 10.8 12.9 20" />
              <path d="M6 12l6 6" />
            </svg>
            <span>Eraser</span>
          </button>

          <button class="tool-btn" type="button" data-tool="fill" aria-pressed="false" title="Fill bucket">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 3 4 9l7.5 7.5a2.1 2.1 0 0 0 3 0L20 11 10 3Z" />
              <path d="M4 9h13" />
              <path d="M19 17c0 1.4-1 2.5-2 2.5s-2-1.1-2-2.5c0-1.2 2-3.3 2-3.3s2 2.1 2 3.3Z" />
            </svg>
            <span>Fill</span>
          </button>

          <button class="tool-btn tool-btn--danger" id="clear-btn" type="button" title="Clear canvas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18" />
              <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            </svg>
            <span>Clear</span>
          </button>
        </div>
      </section>

      <!-- Color ------------------------------------------------------------>
      <section class="panel" aria-labelledby="color-heading">
        <h2 id="color-heading" class="panel-title">Color</h2>

        <div class="color-current-row">
          <span class="color-current-swatch" id="current-color-swatch" aria-hidden="true"></span>
          <label class="field field--grow">
            <span class="field-label">Custom</span>
            <input type="color" id="color-picker" value="#7c5cff" />
          </label>
        </div>

        <div class="palette" id="palette" role="group" aria-label="Color palette"></div>
      </section>

      <!-- Export ------------------------------------------------------------>
      <section class="panel" aria-labelledby="export-heading">
        <h2 id="export-heading" class="panel-title">Export</h2>
        <button id="export-btn" class="btn btn-primary btn-block" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12" />
            <path d="m7 10 5 5 5-5" />
            <path d="M5 21h14" />
          </svg>
          Download PNG
        </button>
        <p class="hint-text" id="export-size-hint">Export size: 256 × 256 px</p>
      </section>

    </aside>

    <!-- ----------------------------- CANVAS STAGE ------------------------ -->
    <main class="canvas-stage">
      <div class="canvas-frame">
        <div id="pixel-canvas" class="pixel-canvas"></div>
      </div>
      <p class="hint-text hint-text--center">
        Click to paint · Click and drag to draw continuously
      </p>
    </main>

  </div>

  <script src="script.js" defer></script>
</body>
</html>
